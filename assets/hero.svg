<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Parth Komalwad, Senior AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font:600 44px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:10px;fill:#e6edf3}
      .s{font:500 13px 'JetBrains Mono','Fira Code',Consolas,monospace;letter-spacing:7px;fill:#7d8590}
      .k{font:500 11px 'JetBrains Mono','Fira Code',Consolas,monospace;letter-spacing:4px;fill:#4b5563}
      .l{stroke:#38bdf8;stroke-width:0.8;stroke-opacity:0.14;fill:none}
      .d{fill:#38bdf8;fill-opacity:0.35}
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- faint constellation, left -->
  <g opacity="0.9">
    <path class="l" d="M60 70 L140 118 L92 176 M140 118 L214 84 M140 118 L206 166 M214 84 L286 128 L206 166 M286 128 L340 96"/>
    <g class="d">
      <circle cx="60" cy="70" r="2"/><circle cx="140" cy="118" r="2.5"/><circle cx="92" cy="176" r="2"/>
      <circle cx="214" cy="84" r="2"/><circle cx="206" cy="166" r="2"/><circle cx="286" cy="128" r="2.5"/><circle cx="340" cy="96" r="1.6"/>
    </g>
  </g>

  <!-- faint constellation, right -->
  <g opacity="0.9">
    <path class="l" d="M1140 190 L1060 142 L1108 84 M1060 142 L986 176 M1060 142 L994 94 M986 176 L914 132 L994 94 M914 132 L860 164"/>
    <g class="d">
      <circle cx="1140" cy="190" r="2"/><circle cx="1060" cy="142" r="2.5"/><circle cx="1108" cy="84" r="2"/>
      <circle cx="986" cy="176" r="2"/><circle cx="994" cy="94" r="2"/><circle cx="914" cy="132" r="2.5"/><circle cx="860" cy="164" r="1.6"/>
    </g>
  </g>

  <!-- one slow travelling signal on each side -->
  <circle r="2.2" fill="#7dd3fc" opacity="0.8">
    <animateMotion dur="9s" repeatCount="indefinite" path="M60 70 L140 118 L214 84 L286 128 L340 96"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#7dd3fc" opacity="0.8">
    <animateMotion dur="9s" begin="4.5s" repeatCount="indefinite" path="M1140 190 L1060 142 L986 176 L914 132 L860 164"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="9s" begin="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="600" y="126" text-anchor="middle" class="t">
    PARTH KOMALWAD
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- accent rule -->
  <rect x="470" y="146" width="260" height="1" fill="url(#rule)">
    <animate attributeName="width" values="0;260" dur="1.6s" begin="0.3s" fill="freeze"/>
    <animate attributeName="x" values="600;470" dur="1.6s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- role -->
  <text x="600" y="176" text-anchor="middle" class="s">
    SENIOR AI ENGINEER
    <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
  </text>

  <!-- keywords -->
  <text x="600" y="214" text-anchor="middle" class="k">
    AGENTIC AI   ·   RAG   ·   NL2SQL   ·   LLM FINE-TUNING   ·   MCP
    <animate attributeName="opacity" values="0;0;0;1" dur="2.6s" fill="freeze"/>
  </text>
</svg>
